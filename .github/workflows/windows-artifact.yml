name: Windows desktop artifact

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Application source commit to build
        required: true
        default: 378a91ab78a1ed2ec3e895caa42f2b290e3049ea
        type: string

permissions:
  contents: read

concurrency:
  group: windows-desktop-artifact-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.14'
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read checked-out application version
        run: GITHUB_SHA="$(git rev-parse HEAD)" python3 scripts/desktop_metadata.py --github-env "$GITHUB_ENV"
      - name: Test core and shared desktop UI
        run: |
          go test ./core/...
          node --check core/cmd/hongguotv/ui/desktop.js
          node --test tests/*.test.cjs
          python3 -m unittest discover -s tests -p 'test_*.py'
          node desktop/frontend/build.mjs
          cd desktop
          go test ./...
          go vet ./...
      - name: Install pinned Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
      - name: Build Windows shell and native core
        env:
          DESKTOP_PLATFORM: windows/amd64
        run: bash scripts/build_desktop.sh
      - name: Smoke-test bundled native core
        run: python3 scripts/verify_desktop_core.py desktop/build/bin/hongguo-tv-core.exe "$HONGGUO_CORE_VERSION"
      - name: Verify Windows ZIP and PE architecture
        shell: python
        run: |
          import hashlib, json, os, struct, subprocess, zipfile
          from pathlib import Path
          archives = list(Path('desktop/dist').glob('hongguo-desktop-*-windows-x64.zip'))
          assert len(archives) == 1, archives
          path = archives[0]
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          parts = path.with_suffix(path.suffix + '.sha256').read_text().strip().split()
          assert parts == [digest, path.name], parts
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              required = {'红果短剧.exe', 'hongguo-tv-core.exe', 'README.txt'}
              assert required <= set(z.namelist()), required - set(z.namelist())
              for name in ['红果短剧.exe', 'hongguo-tv-core.exe']:
                  data = z.read(name)
                  assert data[:2] == b'MZ'
                  offset = struct.unpack_from('<I', data, 0x3c)[0]
                  assert data[offset:offset+4] == b'PE\0\0'
                  assert struct.unpack_from('<H', data, offset+4)[0] == 0x8664
          report = {'file': path.name, 'size_bytes': path.stat().st_size, 'sha256': digest, 'architecture': 'windows-x64', 'version': os.environ['APP_VERSION'], 'source_commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(), 'core_version': os.environ['HONGGUO_CORE_VERSION'], 'core_smoke_test_passed': True, 'gui_playback_tested': False}
          Path('desktop/dist/verification.json').write_text(json.dumps(report, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(json.dumps(report, indent=2, ensure_ascii=False))
      - uses: actions/upload-artifact@v4
        with:
          name: hongguo-desktop-windows-x64
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 14
